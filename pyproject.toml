[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubsfree"
version = "0.1.0.dev0"
description = "Null models and constrained surrogates for attention-structure claims"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Stefan Ojanen"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.45", "datasets>=2.19"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
hubsfree = "hubsfree.cli:main"

[tool.setuptools]
packages = ["hubsfree"]
