[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubsfree"
version = "0.1.0.dev0"
description = "Null models and constrained surrogates for attention-structure claims"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Stefan Ojanen"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]
keywords = ["attention", "interpretability", "null models", "surrogates", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/StefanOjanen/hubs-for-free"
Repository = "https://github.com/StefanOjanen/hubs-for-free"
Documentation = "https://github.com/StefanOjanen/hubs-for-free/blob/main/docs/toolkit.md"

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.45", "datasets>=2.19", "sentencepiece>=0.2", "protobuf>=4"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
hubsfree = "hubsfree.cli:main"

[tool.setuptools]
packages = ["hubsfree"]
